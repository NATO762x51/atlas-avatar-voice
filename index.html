<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Voice</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
main {
  width: min(94%, 440px);
  text-align: center;
}
h1 { margin-bottom: 8px; }
p { color: #b9bdca; }
.portrait {
  position: relative;
  margin: 25px auto;
}

.portrait img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px;
  box-shadow: 0 0 35px #31415a;
}

.mouth {
  position: absolute;
  /* These percentages align the overlay to the lips in PNG image.png. */
  left: 46.39%;
  top: 26.8%;
  width: 15.1%;
  height: 7.7%;
  background: linear-gradient(145deg, #341418, #541e25 75%, #82333c);
  opacity: 0;
  pointer-events: none;
}

.portrait.speaking .mouth {
  animation: talk 470ms ease-in-out infinite;
}

@keyframes talk {
  0%, 100% {
    opacity: 0;
    clip-path: polygon(0 0, 16% 26%, 35% 44%, 56% 56%, 72% 59%, 88% 52%, 100% 43%,
      88% 52%, 72% 59%, 56% 56%, 35% 44%, 16% 26%);
  }
  32% {
    opacity: .96;
    clip-path: polygon(0 0, 16% 26%, 35% 44%, 56% 56%, 72% 59%, 88% 52%, 100% 43%,
      88% 65%, 72% 83%, 56% 86%, 35% 70%, 16% 43%);
  }
  65% {
    opacity: .85;
    clip-path: polygon(0 0, 16% 26%, 35% 44%, 56% 56%, 72% 59%, 88% 52%, 100% 43%,
      88% 57%, 72% 69%, 56% 71%, 35% 58%, 16% 33%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .portrait.speaking .mouth {
    animation: none;
  }
}

button {
  padding: 16px 30px;
  border: none;
  border-radius: 30px;
  background: #438cce;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
button:disabled { opacity: .55; }
#status { min-height: 24px; }
</style>
</head>
<body>
<main>
  <h1>ATLAS</h1>
  <p>Avatar & Voice Workshop</p>

  <div id="face" class="portrait">
    <img src="PNG%20image.png" alt="Atlas portrait" width="1086" height="1448">
    <span class="mouth" aria-hidden="true"></span>
  </div>

  <button id="speak">Hear Atlas</button>
  <p id="status">Ready to speak</p>
</main>

<script>
const face = document.getElementById("face");
const button = document.getElementById("speak");
const speechStatus = document.getElementById("status");

const supported =
  "speechSynthesis" in window &&
  "SpeechSynthesisUtterance" in window;

if (!supported) {
  speechStatus.textContent = "Speech unavailable in this browser";
  button.disabled = true;
}

button.addEventListener("click", () => {
  if (!supported) return;

  button.disabled = true;
  speechStatus.textContent = "Starting speech…";

  const message = new SpeechSynthesisUtterance(
    "Hey there! Atlas here. " +
    "It's good to hear from you. " +
    "We're bringing my voice and animation to life!"
  );

  message.lang = "en-US";
  message.rate = 0.95;
  message.pitch = 1.08;

  message.onstart = () => {
    face.classList.add("speaking");
    speechStatus.textContent = "Atlas is speaking…";
  };

  function finish() {
    face.classList.remove("speaking");
    speechStatus.textContent = "Ready to speak";
    button.disabled = false;
  }

  message.onend = finish;
  message.onerror = () => {
    finish();
    speechStatus.textContent = "Speech could not play. Try again.";
  };

  speechSynthesis.speak(message);
});
</script>
</body>
</html>
