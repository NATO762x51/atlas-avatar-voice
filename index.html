<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Voice</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
main {
  width: min(94%, 440px);
  text-align: center;
}
h1 { margin-bottom: 8px; }
p { color: #b9bdca; }
.portrait {
  position: relative;
  margin: 25px auto;
  transform-origin: center 75%;
  animation: atlas-breathe 5.5s ease-in-out infinite;
}
@keyframes atlas-breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-3px) scale(1.006); }
}
.portrait.speaking {
  animation: atlas-talk 3.2s ease-in-out infinite;
}
@keyframes atlas-talk {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  35% { transform: translateY(-4px) rotate(-.45deg); }
  70% { transform: translateY(-2px) rotate(.35deg); }
}
@media (prefers-reduced-motion: reduce) {
  .portrait, .portrait.speaking { animation: none; }
}

.portrait img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px;
  box-shadow: 0 0 35px #31415a;
}

.mouth-opening,
.lower-lip {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.mouth-opening {
  /* The top edge follows the lower edge of the teeth in the portrait. */
  left: 46.39%;
  top: 26.8%;
  width: 15.1%;
  height: 7.7%;
  background: linear-gradient(145deg, #2c1014, #5a2028);
  clip-path: polygon(0 0, 16% 26%, 35% 44%, 56% 56%, 72% 59%, 88% 52%, 100% 43%,
    94% 67%, 77% 96%, 56% 99%, 34% 85%, 15% 58%);
}

.lower-lip {
  /* Reuse the portrait pixels so the lip texture moves with the opening. */
  inset: 0;
  background: url("PNG%20image.png") center / 100% 100% no-repeat;
  clip-path: polygon(46.39% 26.8%, 48.8% 28.8%, 51.68% 30.19%, 54.85% 31.11%,
    57.26% 31.34%, 59.68% 30.8%, 61.49% 30.11%, 60.04% 31.25%,
    57.83% 32.85%, 55.02% 33.84%, 52.3% 33.74%, 50.06% 32.8%, 48.4% 31.3%);
  transform-origin: 54% 28%;
}

.portrait.speaking .mouth-opening { opacity: var(--mouth-open, 0); transform: scaleY(var(--mouth-scale, 1)); transform-origin: center top; transition: opacity 75ms ease-out, transform 75ms ease-out; }
.portrait.speaking .lower-lip { opacity: var(--mouth-open, 0); transform: scaleY(var(--lip-scale, 1)); transition: opacity 75ms ease-out, transform 75ms ease-out; }

.full-body-video {
  width: 100%;
  max-height: 72vh;
  margin: 25px auto;
  border-radius: 18px;
  object-fit: contain;
}

button {
  padding: 16px 30px;
  border: none;
  border-radius: 30px;
  background: #438cce;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
button:disabled { opacity: .55; }
#status { min-height: 24px; }
.voice-settings, .model-preview { margin: 16px 0; text-align: left; }
.voice-settings select, .model-preview select { display: block; width: 100%; margin-top: 6px; padding: 8px; }
.model-preview input { display: block; max-width: 100%; margin: 12px 0; }
model-viewer { display: block; width: 100%; height: min(60vh, 500px); background: #1e2535; border-radius: 12px; }
model-viewer[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>ATLAS</h1>
  <p>Avatar & Voice Workshop</p>

  <div id="face" class="portrait">
    <img src="PNG%20image.png" alt="Atlas portrait" width="1086" height="1448">
    <span class="mouth-opening" aria-hidden="true"></span>
    <span class="lower-lip" aria-hidden="true"></span>
  </div>

  <video id="full-body" class="full-body-video" preload="metadata" playsinline hidden aria-label="Atlas full-body greeting"></video>

  <button id="speak">Hear Atlas</button>
  <button id="listen" type="button" style="margin-top:12px;background:#285d75">Talk to Atlas</button>
  <p id="status" role="status">Ready to speak</p>
  <section id="mic-reply" hidden aria-label="Microphone test">
    <p id="transcript" aria-live="polite"></p>
    <button id="play-reply" type="button">Play reply</button>
  </section>
  <div class="voice-settings" id="voice-settings" hidden>
    <label for="voice">Atlas voice</label>
    <select id="voice"><option value="">Automatic</option></select>
  </div>
  <details class="model-preview">
    <summary>Preview a full-body model</summary>
    <label for="model-file">Choose a self-contained Blender export (.glb)</label>
    <input id="model-file" type="file" accept=".glb,model/gltf-binary">
    <p id="model-status" role="status"></p>
    <model-viewer id="model" camera-controls touch-action="pan-y" autoplay hidden alt="Full-body avatar model"></model-viewer>
    <div id="animation-controls" hidden>
      <label for="animation">Model animation</label>
      <select id="animation"></select>
    </div>
  </details>
</main>

<script>
const face = document.getElementById("face");
const button = document.getElementById("speak");
const speechStatus = document.getElementById("status");
const listenButton = document.getElementById("listen");
let mouthTimer = null;
let mouthCueUntil = 0;
let mouthPhase = 0;
function setMouth(level) {
  const amount = Math.max(0, Math.min(1, level));
  face.style.setProperty("--mouth-open", amount.toFixed(2));
  face.style.setProperty("--mouth-scale", (1 + amount * .48).toFixed(2));
  face.style.setProperty("--lip-scale", (1 + amount * .22).toFixed(2));
}
function stopMouth() {
  clearInterval(mouthTimer);
  mouthTimer = null;
  mouthCueUntil = 0;
  setMouth(0);
  face.classList.remove("speaking");
}
// Web Speech API does not expose synthesized audio samples. These are
// text-guided approximate mouth cues, not true phoneme/audio lip sync.
function startMouth() {
  stopMouth();
  face.classList.add("speaking");
  mouthPhase = 0;
  setMouth(.22);
  mouthTimer = setInterval(() => {
    if (performance.now() < mouthCueUntil) return;
    mouthPhase += .82;
    setMouth(.17 + .19 * (1 + Math.sin(mouthPhase)) / 2);
  }, 85);
}
function articulateWord(word) {
  if (!word) return;
  const clean = word.toLowerCase().replace(/[^a-z]/g, "");
  if (!clean) { setMouth(0); return; }
  const vowels = (clean.match(/[aeiouy]/g) || []).length;
  const closed = /^[bmp]/.test(clean);
  setMouth(closed ? .08 : Math.min(.82, .24 + vowels * .13));
  mouthCueUntil = performance.now() + Math.min(230, 85 + clean.length * 14);
}
const fullBody = document.getElementById("full-body");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = Recognition ? new Recognition() : null;
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
const voiceSelect = document.getElementById("voice");
const preferredVoices = [
  /\bsamantha\b/i,
  /\bjenny\b/i,
  /\baria\b/i,
  /\bava\b/i,
  /\bzira\b/i,
  /google us english/i,
  /\bkaren\b/i,
  /\bmoira\b/i,
  /\bdaniel(le)\b/i
];
let voices = [];
let voicePreference = "";
try { voicePreference = localStorage.getItem("atlas-voice") || ""; } catch {}

function refreshVoices() {
  voices = speechSynthesis.getVoices().filter(voice => /^en(?:-|$)/i.test(voice.lang));
  voiceSelect.length = 1;
  for (const voice of voices) voiceSelect.add(new Option(voice.name + " (" + voice.lang + ")", voice.voiceURI));
  voiceSelect.value = voices.some(voice => voice.voiceURI === voicePreference) ? voicePreference : "";
}

if (canSpeak) {
  document.getElementById("voice-settings").hidden = false;
  refreshVoices();
  speechSynthesis.addEventListener("voiceschanged", refreshVoices);
  voiceSelect.addEventListener("change", () => {
    voicePreference = voiceSelect.value;
    try { localStorage.setItem("atlas-voice", voicePreference); } catch {}
  });
}

const replyPanel = document.getElementById("mic-reply");
const transcript = document.getElementById("transcript");
const replyButton = document.getElementById("play-reply");
let lastHeard = "";
let clip = null;
let state = "idle";

function showState(next, message) {
  state = next;
  button.disabled = next !== "idle" || (!canSpeak && !clip);
  listenButton.disabled = next !== "idle" || !recognition;
  replyButton.disabled = next !== "idle" || !canSpeak || !lastHeard;
  speechStatus.textContent = message;
}

function speak(text, finished = "Ready to speak", failed = "") {
  if (!canSpeak) {
    showState("idle", finished);
    return;
  }
  const utterance = new SpeechSynthesisUtterance(text);
  const chosen = voices.find(candidate => candidate.voiceURI === voiceSelect.value)
    || preferredVoices.map(pattern => voices.find(candidate => pattern.test(candidate.name))).find(Boolean);
  const voice = chosen || voices.find(candidate => candidate.default);
  if (voice) utterance.voice = voice;
  utterance.lang = voice?.lang || "en-US";
  utterance.rate = .96;
  utterance.pitch = chosen ? 1.04 : 1.12;

  showState("speaking", "Starting speech…");
  let started = false;
  let done = false;
  let deadline;
  let poll;

  function finish(status) {
    if (done) return;
    done = true;
    clearTimeout(deadline);
    clearInterval(poll);
    stopMouth();
    showState("idle", status);
  }

  function start() {
    if (done || started) return;
    started = true;
    clearInterval(poll);
    clearTimeout(deadline);
    deadline = setTimeout(timeOut, Math.max(15000, text.length * 180));
    startMouth();
    showState("speaking", "Atlas is speaking…");
  }

  const failure = failed || "Speech could not play. Check your browser audio and try again.";
  function timeOut() {
    finish(failure);
    speechSynthesis.cancel();
  }

  utterance.onstart = start;
  utterance.onboundary = event => {
    if (done) return;
    start();
    if (event.name === "word") articulateWord(text.slice(event.charIndex).split(/\s/)[0]);
  };
  utterance.onend = () => finish(finished);
  utterance.onerror = () => finish(failure);
  deadline = setTimeout(timeOut, 4500);
  poll = setInterval(() => {
    if (speechSynthesis.speaking && !speechSynthesis.pending) start();
  }, 80);

  try {
    speechSynthesis.speak(utterance);
  } catch {
    finish(failure);
  }
}

const greeting = "Hey there! Atlas here. It's good to hear from you. We're bringing my voice and animation to life!";

if (recognition) {
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let listenTimeout;

  function finishListening(message) {
    if (state !== "listening") return;
    clearTimeout(listenTimeout);
    showState("idle", message);
  }

  listenButton.addEventListener("click", () => {
    if (state !== "idle") return;
    lastHeard = "";
    replyPanel.hidden = true;
    transcript.textContent = "";
    showState("listening", "Waiting for the microphone…");
    listenTimeout = setTimeout(() => {
      finishListening("The microphone timed out. Tap Talk to Atlas to retry.");
      recognition.abort();
    }, 12000);
    try {
      recognition.start();
    } catch {
      finishListening("Microphone is busy. Try again.");
    }
  });

  recognition.onaudiostart = () => {
    if (state === "listening") speechStatus.textContent = "Listening… say a short phrase.";
  };

  recognition.onresult = event => {
    if (state !== "listening") return;
    lastHeard = event.results[event.resultIndex ?? 0]?.[0]?.transcript.trim() || "";
    if (!lastHeard) return;
    transcript.textContent = "Atlas heard: " + lastHeard;
    replyPanel.hidden = false;
    finishListening("Phrase captured.");
    recognition.stop();
    speak("I heard you say: " + lastHeard,
      "Reply finished. Tap Talk to Atlas to try another phrase.",
      "Phrase captured. Tap Play reply to hear it.");
  };

  recognition.onerror = event => {
    const messages = {
      "not-allowed": "Allow microphone access for this page and try again.",
      "service-not-allowed": "Speech recognition is unavailable here. Try opening Atlas in Edge or Chrome.",
      "audio-capture": "No microphone signal. Check your input device.",
      "network": "The browser speech service could not connect. Open Atlas in Edge or Chrome and retry.",
      "no-speech": "No speech detected. Tap Talk to Atlas and say a short phrase."
    };
    finishListening(messages[event.error] || "Microphone error: " + event.error);
  };

  recognition.onend = () => {
    finishListening("No phrase captured. Tap Talk to Atlas to retry.");
  };
} else {
  listenButton.title = "Speech recognition is unavailable in this browser.";
  listenButton.textContent = "Microphone unavailable";
}

replyButton.addEventListener("click", () => {
  if (state === "idle" && lastHeard) speak("I heard you say: " + lastHeard, "Reply finished.");
});

showState("idle", canSpeak ? "Ready to speak" : "Speech is unavailable in this browser.");
fetch("atlas-full-body.mp4", { method: "HEAD" }).then(response => {
  if (!response.ok || !response.headers.get("content-type")?.startsWith("video/")) return;
  clip = response.url;
  if (state === "idle" && !canSpeak) showState("idle", "Ready to speak");
}).catch(() => {});

function closeVideo() {
  fullBody.hidden = true;
  face.hidden = false;
}

function usePortrait() {
  if (state !== "video") return;
  clip = null;
  closeVideo();
  fullBody.removeAttribute("src");
  speak(greeting, canSpeak ? "Ready to speak" : "The greeting is unavailable.");
}

fullBody.addEventListener("ended", () => {
  if (state !== "video") return;
  closeVideo();
  showState("idle", "Ready to speak");
});
fullBody.addEventListener("error", usePortrait);

button.addEventListener("click", () => {
  if (state !== "idle") return;
  if (!clip || voiceSelect.value) {
    speak(greeting);
    return;
  }
  showState("video", "Playing Atlas greeting…");
  fullBody.src = clip;
  fullBody.hidden = false;
  face.hidden = true;
  fullBody.play().catch(usePortrait);
});

const modelFile = document.getElementById("model-file");
const viewer = document.getElementById("model");
const modelStatus = document.getElementById("model-status");
const animations = document.getElementById("animation");
const controls = document.getElementById("animation-controls");
let viewerModule;
let modelUrl;
let selection = 0;

modelFile.addEventListener("change", async () => {
  const file = modelFile.files[0];
  if (!file) return;
  const request = ++selection;
  viewer.hidden = true;
  controls.hidden = true;
  viewer.removeAttribute("src");
  if (modelUrl) URL.revokeObjectURL(modelUrl);
  modelUrl = null;
  if (!/\.glb$/i.test(file.name)) {
    modelStatus.textContent = "Choose a .glb file exported from Blender.";
    return;
  }
  modelStatus.textContent = "Loading " + file.name + "…";
  try {
    viewerModule ??= import("https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js");
    await viewerModule;
    if (request !== selection) return;
    modelUrl = URL.createObjectURL(file);
    viewer.removeAttribute("animation-name");
    viewer.src = modelUrl;
    viewer.hidden = false;
  } catch {
    viewerModule = null;
    if (request === selection) modelStatus.textContent = "The 3D viewer could not start. Check your connection and try again.";
  } finally {
    if (request === selection) modelFile.value = "";
  }
});

viewer.addEventListener("load", () => {
  if (!modelUrl || viewer.src !== modelUrl) return;
  animations.replaceChildren(...viewer.availableAnimations.map(name => new Option(name, name)));
  controls.hidden = animations.length === 0;
  modelStatus.textContent = controls.hidden
    ? "Model loaded. This file contains no animation clips."
    : "Model loaded. Choose an animation to preview.";
});

viewer.addEventListener("error", () => {
  if (!modelUrl || viewer.src !== modelUrl) return;
  viewer.hidden = true;
  controls.hidden = true;
  modelStatus.textContent = "This model could not be displayed. Check the GLB export and WebGL support.";
});

animations.addEventListener("change", () => {
  viewer.animationName = animations.value;
  viewer.play();
});
</script>
</body>
</html>
