<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Voice</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
main {
  width: min(94%, 440px);
  text-align: center;
}
h1 { margin-bottom: 8px; }
p { color: #b9bdca; }
.portrait {
  position: relative;
  margin: 25px auto;
}

.portrait img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px;
  box-shadow: 0 0 35px #31415a;
}

.mouth-opening,
.lower-lip {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.mouth-opening {
  /* The top edge follows the lower edge of the teeth in the portrait. */
  left: 46.39%;
  top: 26.8%;
  width: 15.1%;
  height: 7.7%;
  background: linear-gradient(145deg, #2c1014, #5a2028);
  clip-path: polygon(0 0, 16% 26%, 35% 44%, 56% 56%, 72% 59%, 88% 52%, 100% 43%,
    94% 67%, 77% 96%, 56% 99%, 34% 85%, 15% 58%);
}

.lower-lip {
  /* Reuse the portrait pixels so the lip texture moves with the opening. */
  inset: 0;
  background: url("PNG%20image.png") center / 100% 100% no-repeat;
  clip-path: polygon(46.39% 26.8%, 48.8% 28.8%, 51.68% 30.19%, 54.85% 31.11%,
    57.26% 31.34%, 59.68% 30.8%, 61.49% 30.11%, 60.04% 31.25%,
    57.83% 32.85%, 55.02% 33.84%, 52.3% 33.74%, 50.06% 32.8%, 48.4% 31.3%);
  transform-origin: 54% 28%;
}

.portrait.speaking .mouth-opening {
  animation: show-opening 470ms ease-in-out infinite;
}

.portrait.speaking .lower-lip {
  animation: move-lip 470ms ease-in-out infinite;
}

@keyframes show-opening {
  0%, 100% { opacity: 0; }
  32% { opacity: 1; }
  65% { opacity: .65; }
}

@keyframes move-lip {
  0%, 100% { opacity: 0; transform: scaleY(1); }
  32% { opacity: 1; transform: scaleY(1.26); }
  65% { opacity: 1; transform: scaleY(1.12); }
}

.full-body-video {
  width: 100%;
  max-height: 72vh;
  margin: 25px auto;
  border-radius: 18px;
  object-fit: contain;
}

button {
  padding: 16px 30px;
  border: none;
  border-radius: 30px;
  background: #438cce;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
button:disabled { opacity: .55; }
#status { min-height: 24px; }
</style>
</head>
<body>
<main>
  <h1>ATLAS</h1>
  <p>Avatar & Voice Workshop</p>

  <div id="face" class="portrait">
    <img src="PNG%20image.png" alt="Atlas portrait" width="1086" height="1448">
    <span class="mouth-opening" aria-hidden="true"></span>
    <span class="lower-lip" aria-hidden="true"></span>
  </div>

  <video id="full-body" class="full-body-video" preload="metadata" playsinline hidden aria-label="Atlas full-body greeting"></video>

  <button id="speak">Hear Atlas</button>
  <p id="status">Ready to speak</p>
</main>

<script>
const face = document.getElementById("face");
const button = document.getElementById("speak");
const speechStatus = document.getElementById("status");

const fullBody = document.getElementById("full-body");
const fullBodyClip = "atlas-full-body.mp4";

const supported =
  "speechSynthesis" in window &&
  "SpeechSynthesisUtterance" in window;

if (!supported) {
  speechStatus.textContent = "Speech unavailable in this browser";
  button.disabled = true;
}

// A published clip supplies its own synchronized voice track.
fetch(fullBodyClip, { method: "HEAD" }).then(response => {
  if (!response.ok) return;
  fullBody.src = fullBodyClip;
  if (!supported) button.disabled = false;
  if (!supported) speechStatus.textContent = "Ready to speak";
}).catch(() => {
  // The portrait greeting remains available if the clip cannot be reached.
});

function closeFullBody() {
  fullBody.hidden = true;
  face.hidden = false;
  button.disabled = false;
  speechStatus.textContent = "Ready to speak";
}

fullBody.addEventListener("ended", closeFullBody);
fullBody.addEventListener("error", () => {
  fullBody.removeAttribute("src");
  if (!fullBody.hidden) {
    closeFullBody();
    speechStatus.textContent = "Video unavailable. Tap Hear Atlas to try the portrait.";
  }
  if (!supported) button.disabled = true;
});

button.addEventListener("click", () => {
  if (button.disabled) return;
  if (fullBody.hasAttribute("src")) {
    button.disabled = true;
    fullBody.hidden = false;
    face.hidden = true;
    speechStatus.textContent = "Playing Atlas greeting…";
    fullBody.play().catch(() => {
      fullBody.removeAttribute("src");
      closeFullBody();
      button.disabled = !supported;
      speechStatus.textContent = supported
        ? "Video unavailable. Tap Hear Atlas to try the portrait."
        : "Video unavailable.";
    });
    return;
  }
  if (!supported) return;

  button.disabled = true;
  speechStatus.textContent = "Starting speech…";

  const message = new SpeechSynthesisUtterance(
    "Hey there! Atlas here. " +
    "It's good to hear from you. " +
    "We're bringing my voice and animation to life!"
  );

  message.lang = "en-US";
  message.rate = 0.95;
  message.pitch = 1.08;

  function start() {
    clearInterval(speechCheck);
    if (face.classList.contains("speaking")) return;
    face.classList.add("speaking");
    speechStatus.textContent = "Atlas is speaking…";
  }

  message.onstart = start;
  message.onboundary = start;
  let speechCheck;

  function finish() {
    clearInterval(speechCheck);
    face.classList.remove("speaking");
    speechStatus.textContent = "Ready to speak";
    button.disabled = false;
  }

  message.onend = finish;
  message.onerror = () => {
    finish();
    speechStatus.textContent = "Speech could not play. Try again.";
  };

  // Some browser voices report speaking without delivering an initial event.
  speechCheck = setInterval(() => {
    if (speechSynthesis.speaking && !speechSynthesis.pending) start();
  }, 80);
  speechSynthesis.speak(message);
});
</script>
</body>
</html>
