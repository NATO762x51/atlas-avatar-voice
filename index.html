<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Voice</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
main {
  width: min(94%, 440px);
  text-align: center;
}
h1 { margin-bottom: 8px; }
p { color: #b9bdca; }
.portrait {
  position: relative;
  margin: 25px auto;
  transform-origin: center 75%;
  animation: atlas-breathe 5.5s ease-in-out infinite;
}
@keyframes atlas-breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-3px) scale(1.006); }
}
.portrait.speaking {
  animation: atlas-talk 3.2s ease-in-out infinite;
}
@keyframes atlas-talk {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  35% { transform: translateY(-4px) rotate(-.45deg); }
  70% { transform: translateY(-2px) rotate(.35deg); }
}
@media (prefers-reduced-motion: reduce) {
  .portrait, .portrait.speaking { animation: none; }
}

.portrait img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 18px;
  box-shadow: 0 0 35px #31415a;
}

.mouth-opening,
.lower-lip {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.mouth-opening {
  /* The top edge follows the lower edge of the teeth in the portrait. */
  left: 46.39%;
  top: 26.8%;
  width: 15.1%;
  height: 7.7%;
  background: linear-gradient(145deg, #2c1014, #5a2028);
  clip-path: polygon(0 0, 16% 26%, 35% 44%, 56% 56%, 72% 59%, 88% 52%, 100% 43%,
    94% 67%, 77% 96%, 56% 99%, 34% 85%, 15% 58%);
}

.lower-lip {
  /* Reuse the portrait pixels so the lip texture moves with the opening. */
  inset: 0;
  background: url("PNG%20image.png") center / 100% 100% no-repeat;
  clip-path: polygon(46.39% 26.8%, 48.8% 28.8%, 51.68% 30.19%, 54.85% 31.11%,
    57.26% 31.34%, 59.68% 30.8%, 61.49% 30.11%, 60.04% 31.25%,
    57.83% 32.85%, 55.02% 33.84%, 52.3% 33.74%, 50.06% 32.8%, 48.4% 31.3%);
  transform-origin: 54% 28%;
}

.portrait.speaking .mouth-opening { opacity: var(--mouth-open, 0); transform: scaleY(var(--mouth-scale, 1)); transform-origin: center top; transition: opacity 75ms ease-out, transform 75ms ease-out; }
.portrait.speaking .lower-lip { opacity: var(--mouth-open, 0); transform: scaleY(var(--lip-scale, 1)); transition: opacity 75ms ease-out, transform 75ms ease-out; }

.full-body-video {
  width: 100%;
  max-height: 72vh;
  margin: 25px auto;
  border-radius: 18px;
  object-fit: contain;
}

button {
  padding: 16px 30px;
  border: none;
  border-radius: 30px;
  background: #438cce;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
button:disabled { opacity: .55; }
#status { min-height: 24px; }
</style>
</head>
<body>
<main>
  <h1>ATLAS</h1>
  <p>Avatar & Voice Workshop</p>

  <div id="face" class="portrait">
    <img src="PNG%20image.png" alt="Atlas portrait" width="1086" height="1448">
    <span class="mouth-opening" aria-hidden="true"></span>
    <span class="lower-lip" aria-hidden="true"></span>
  </div>

  <video id="full-body" class="full-body-video" preload="metadata" playsinline hidden aria-label="Atlas full-body greeting"></video>

  <button id="speak">Hear Atlas</button>
  <button id="listen" type="button" style="margin-top:12px;background:#285d75">Talk to Atlas</button>
  <p id="status" role="status">Ready to speak</p>
</main>

<script>
const face = document.getElementById("face");
const button = document.getElementById("speak");
const speechStatus = document.getElementById("status");
const listenButton = document.getElementById("listen");
let mouthTimer = null;
let mouthCueUntil = 0;
let mouthPhase = 0;
function setMouth(level) {
  const amount = Math.max(0, Math.min(1, level));
  face.style.setProperty("--mouth-open", amount.toFixed(2));
  face.style.setProperty("--mouth-scale", (1 + amount * .48).toFixed(2));
  face.style.setProperty("--lip-scale", (1 + amount * .22).toFixed(2));
}
function stopMouth() {
  clearInterval(mouthTimer);
  mouthTimer = null;
  mouthCueUntil = 0;
  setMouth(0);
  face.classList.remove("speaking");
}
// Web Speech API does not expose synthesized audio samples. These are
// text-guided approximate mouth cues, not true phoneme/audio lip sync.
function startMouth() {
  stopMouth();
  face.classList.add("speaking");
  mouthPhase = 0;
  setMouth(.22);
  mouthTimer = setInterval(() => {
    if (performance.now() < mouthCueUntil) return;
    mouthPhase += .82;
    setMouth(.17 + .19 * (1 + Math.sin(mouthPhase)) / 2);
  }, 85);
}
function articulateWord(word) {
  if (!word) return;
  const clean = word.toLowerCase().replace(/[^a-z]/g, "");
  if (!clean) { setMouth(0); return; }
  const vowels = (clean.match(/[aeiouy]/g) || []).length;
  const closed = /^[bmp]/.test(clean);
  setMouth(closed ? .08 : Math.min(.82, .24 + vowels * .13));
  mouthCueUntil = performance.now() + Math.min(230, 85 + clean.length * 14);
}
const fullBody = document.getElementById("full-body");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = Recognition ? new Recognition() : null;
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let clip = null;
let state = "idle";

function showState(next, message) {
  state = next;
  button.disabled = next !== "idle" || (!canSpeak && !clip);
  listenButton.disabled = next !== "idle" || !recognition;
  speechStatus.textContent = message;
}

function speak(text, finished = "Ready to speak") {
  if (!canSpeak) {
    showState("idle", finished);
    return;
  }
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = .95;
  utterance.pitch = 1.08;

  showState("speaking", "Starting speech…");
  let started = false;
  let done = false;
  let deadline;
  let poll;

  function finish(status) {
    if (done) return;
    done = true;
    clearTimeout(deadline);
    clearInterval(poll);
    stopMouth();
    showState("idle", status);
  }

  function start() {
    if (done || started) return;
    started = true;
    clearInterval(poll);
    clearTimeout(deadline);
    deadline = setTimeout(timeOut, Math.max(15000, text.length * 180));
    startMouth();
    showState("speaking", "Atlas is speaking…");
  }

  const failure = "Speech could not play. Check your browser audio and try again.";
  function timeOut() {
    finish(failure);
    speechSynthesis.cancel();
  }

  utterance.onstart = start;
  utterance.onboundary = event => {
    if (done) return;
    start();
    if (event.name === "word") articulateWord(text.slice(event.charIndex).split(/\s/)[0]);
  };
  utterance.onend = () => finish(finished);
  utterance.onerror = () => finish(failure);
  deadline = setTimeout(timeOut, 4500);
  poll = setInterval(() => {
    if (speechSynthesis.speaking && !speechSynthesis.pending) start();
  }, 80);

  try {
    speechSynthesis.speak(utterance);
  } catch {
    finish(failure);
  }
}

const greeting = "Hey there! Atlas here. It's good to hear from you. We're bringing my voice and animation to life!";

if (recognition) {
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let captured = null;
  let micError = null;

  listenButton.addEventListener("click", () => {
    if (state !== "idle") return;
    captured = null;
    micError = null;
    showState("listening", "Listening… allow microphone access if prompted.");
    try {
      recognition.start();
    } catch {
      showState("idle", "Microphone is busy. Try again.");
    }
  });

  recognition.onresult = event => {
    captured = event.results[0][0].transcript;
    showState("listening", "You said: " + captured);
  };
  recognition.onerror = event => {
    if (state !== "listening") return;
    const messages = {
      "not-allowed": "Allow microphone access in this browser and try again.",
      "audio-capture": "No microphone is available. Check your input device.",
      "network": "The browser speech service is unavailable. Try again.",
      "no-speech": "No speech detected. Tap Talk to Atlas to retry."
    };
    micError = messages[event.error] || "Microphone error: " + event.error;
    speechStatus.textContent = micError;
  };
  recognition.onend = () => {
    if (state !== "listening") return;
    if (micError || !captured) {
      showState("idle", micError || "No speech detected. Tap Talk to Atlas to retry.");
      return;
    }
    speak("I heard you say: " + captured, "You said: " + captured);
  };
} else {
  listenButton.title = "Speech recognition is unavailable in this browser.";
}

showState("idle", canSpeak ? "Ready to speak" : "Speech is unavailable in this browser.");
fetch("atlas-full-body.mp4", { method: "HEAD" }).then(response => {
  if (!response.ok || !response.headers.get("content-type")?.startsWith("video/")) return;
  clip = response.url;
  if (state === "idle" && !canSpeak) showState("idle", "Ready to speak");
}).catch(() => {});

function closeVideo() {
  fullBody.hidden = true;
  face.hidden = false;
}

function usePortrait() {
  if (state !== "video") return;
  clip = null;
  closeVideo();
  fullBody.removeAttribute("src");
  speak(greeting, canSpeak ? "Ready to speak" : "The greeting is unavailable.");
}

fullBody.addEventListener("ended", () => {
  if (state !== "video") return;
  closeVideo();
  showState("idle", "Ready to speak");
});
fullBody.addEventListener("error", usePortrait);

button.addEventListener("click", () => {
  if (state !== "idle") return;
  if (!clip) {
    speak(greeting);
    return;
  }
  showState("video", "Playing Atlas greeting…");
  fullBody.src = clip;
  fullBody.hidden = false;
  face.hidden = true;
  fullBody.play().catch(usePortrait);
});
</script>
</body>
</html>
